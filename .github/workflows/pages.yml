name: Deploy ASTRA to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc -b
      - run: pnpm exec vite build
        env:
          VITE_BASE: /astra/
      - name: Adapt absolute asset links for project Pages path
        run: |
          node --input-type=module - <<'NODE'
          import { readdir, readFile, writeFile, stat } from 'node:fs/promises';
          import { join } from 'node:path';
          async function visit(dir) {
            for (const name of await readdir(dir)) {
              const file = join(dir, name);
              if ((await stat(file)).isDirectory()) await visit(file);
              else if (/\.(html|js|css|svg)$/.test(name)) {
                let text = await readFile(file, 'utf8');
                for (const path of ['spatial/', 'universe/', 'benchmark-origin/', 'ui/', 'favicon.svg']) {
                  text = text
                    .replaceAll(`"/${path}`, `"/astra/${path}`)
                    .replaceAll(`'/${path}`, `'/astra/${path}`)
                    .replaceAll('`/' + path, '`/astra/' + path);
                }
                await writeFile(file, text);
              }
            }
          }
          await visit('dist');
          NODE
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
