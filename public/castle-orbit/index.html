<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>ASTRA · замок</title>
<style>
  :root { color-scheme: dark; --ink: #f2efe8; --dim: #a9a6b3; --line: rgba(242,239,232,.22); }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: #07060c; color: var(--ink); font-family: system-ui, "Segoe UI", sans-serif; overflow: hidden; }
  #stage { position: fixed; inset: 0; display: grid; place-items: center; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
  #stage.drag { cursor: grabbing; }
  canvas { width: 100%; height: 100%; display: block; }
  .bar { position: fixed; left: 16px; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom)); display: flex; gap: 12px; align-items: center; justify-content: center; pointer-events: none; }
  .pill { pointer-events: auto; background: rgba(8,7,14,.62); border: 1px solid var(--line); border-radius: 999px; padding: 10px 16px; font-size: 14px; color: var(--dim); backdrop-filter: blur(10px); }
  .pill button { all: unset; cursor: pointer; padding: 2px 8px; color: var(--ink); }
  .pill button:focus-visible { outline: 2px solid #8fd8c8; border-radius: 6px; }
  #range { width: min(320px, 46vw); accent-color: #8fd8c8; vertical-align: middle; }
  #loading { position: fixed; top: 16px; left: 16px; font-size: 13px; color: var(--dim); background: rgba(8,7,14,.62); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; }
  #title { position: fixed; top: 16px; right: 16px; font-size: 13px; color: var(--dim); text-align: right; max-width: 52vw; }
</style>
</head>
<body>
<div id="stage" role="img" aria-label="Замок ASTRA, предрендер Blender. Перетащите, чтобы повернуть вид">
  <canvas id="c"></canvas>
</div>
<div id="loading">Загрузка кадров 0 / 21</div>
<div id="title">Предрендер Blender Cycles<br />вид совпадает с Blender, свободного вращения нет<br /><a href="../" style="color:#8fd8c8">← К ASTRA</a></div>
<div class="bar">
  <div class="pill">
    <button id="left" aria-label="Повернуть влево">◀</button>
    <input id="range" type="range" min="0" max="20" step="0.01" value="10" aria-label="Угол обзора" />
    <button id="right" aria-label="Повернуть вправо">▶</button>
  </div>
  <div class="pill" id="hint">Перетащите вид мышью или пальцем</div>
</div>
<script type="module">
  const COUNT = 21, BASE = "./f";
  const stage = document.getElementById("stage"), canvas = document.getElementById("c"), ctx = canvas.getContext("2d");
  const range = document.getElementById("range"), loading = document.getElementById("loading"), hint = document.getElementById("hint");
  const images = new Array(COUNT);
  let loaded = 0, pos = 10, target = 10, velocity = 0, dragging = false, lastX = 0, lastT = 0, drawn = -1;

  const url = (i) => BASE + String(i).padStart(2, "0") + ".webp";
  // Load the middle frame first so the view appears at once, then the rest outward.
  const order = [...Array(COUNT).keys()].sort((a, b) => Math.abs(a - 10) - Math.abs(b - 10));
  for (const i of order) {
    const img = new Image();
    img.decoding = "async";
    img.onload = () => {
      images[i] = img;
      loaded++;
      loading.textContent = "Загрузка кадров " + loaded + " / " + COUNT;
      if (loaded === COUNT) loading.remove();
      drawn = -1;
    };
    img.onerror = () => { loading.textContent = "Не удалось загрузить кадр " + i; };
    img.src = url(i);
  }

  function fit() {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    canvas.width = Math.round(innerWidth * dpr);
    canvas.height = Math.round(innerHeight * dpr);
    drawn = -1;
  }
  addEventListener("resize", fit);
  fit();

  function nearestLoaded(i) {
    if (images[i]) return images[i];
    for (let d = 1; d < COUNT; d++) {
      if (images[i - d]) return images[i - d];
      if (images[i + d]) return images[i + d];
    }
    return null;
  }

  function draw() {
    const i = Math.max(0, Math.min(COUNT - 1, Math.round(pos)));
    const img = nearestLoaded(i);
    if (!img || drawn === i) return;
    drawn = i;
    const cw = canvas.width, ch = canvas.height, s = Math.min(cw / img.width, ch / img.height);
    const w = img.width * s, h = img.height * s;
    ctx.fillStyle = "#07060c";
    ctx.fillRect(0, 0, cw, ch);
    ctx.drawImage(img, (cw - w) / 2, (ch - h) / 2, w, h);
  }

  function setTarget(v) { target = Math.max(0, Math.min(COUNT - 1, v)); }

  function tick() {
    if (!dragging) {
      target = Math.max(0, Math.min(COUNT - 1, target + velocity));
      velocity *= 0.92;
      if (Math.abs(velocity) < 0.0005) velocity = 0;
    }
    pos += (target - pos) * 0.22;
    if (Math.abs(target - pos) < 0.002) pos = target;
    range.value = String(pos);
    draw();
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  const perFrame = () => Math.max(26, innerWidth / 26); // pixels of drag per frame step
  stage.addEventListener("pointerdown", (e) => {
    dragging = true; velocity = 0; lastX = e.clientX; lastT = performance.now();
    stage.classList.add("drag"); stage.setPointerCapture(e.pointerId); hint.style.opacity = "0.5";
  });
  stage.addEventListener("pointermove", (e) => {
    if (!dragging) return;
    const dx = e.clientX - lastX, dt = Math.max(1, performance.now() - lastT);
    lastX = e.clientX; lastT = performance.now();
    const step = -dx / perFrame();
    setTarget(target + step);
    velocity = step * (16 / dt) * 0.6;
  });
  const end = () => { dragging = false; stage.classList.remove("drag"); };
  stage.addEventListener("pointerup", end);
  stage.addEventListener("pointercancel", end);
  stage.addEventListener("dblclick", () => { velocity = 0; setTarget(10); });
  stage.addEventListener("wheel", (e) => { e.preventDefault(); setTarget(target + Math.sign(e.deltaY) * 0.5); }, { passive: false });
  range.addEventListener("input", () => { velocity = 0; setTarget(Number(range.value)); });
  document.getElementById("left").addEventListener("click", () => setTarget(Math.round(target) - 1));
  document.getElementById("right").addEventListener("click", () => setTarget(Math.round(target) + 1));
  addEventListener("keydown", (e) => {
    if (e.key === "ArrowLeft") setTarget(Math.round(target) - 1);
    if (e.key === "ArrowRight") setTarget(Math.round(target) + 1);
    if (e.key === "Home") setTarget(10);
  });
</script>
</body>
</html>
