<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ASTRA — обсерватория / отдельный прототип</title><link rel="stylesheet" href="./style.css"></head><body>
<div id="scene" aria-label="Трёхмерная обсерватория на облаке"></div>
<header><a class="brand" href="#outside">astra.</a><span>ОБСЕРВАТОРИЯ <small>ОТДЕЛЬНЫЙ ПРОТОТИП</small></span><button id="pause" aria-pressed="false">Пауза движения</button></header>
<main><div class="intro"><span class="eyebrow" id="eyebrow">ТВОЁ МЕСТО В ГАЛАКТИКЕ</span><h1 id="title">Место для<br>твоих открытий</h1><p id="description">Обсерватория на белом облаке.<br>Войди и рассмотри пространство изнутри.</p></div>
<nav aria-label="Осмотр обсерватории"><button id="enter" class="primary">Войти внутрь</button><button id="outside" hidden>Снаружи</button><button id="rotate">Другой ракурс</button></nav>
<div id="rooms" hidden><button data-room="telescope">Телескоп</button><button data-room="atlas">Атлас наблюдений</button><button data-room="workshop">Мастерская</button><button data-room="gallery">Галерея открытий</button></div>
<p class="foot">Вымышленный пример · не связан с профилем · перетаскивай сцену для осмотра</p><p id="status" role="status"></p></main>
<dialog id="detail"><button id="close" aria-label="Закрыть описание">×</button><span class="eyebrow">ПРИМЕР / НЕ ТВОИ ДАННЫЕ</span><h2></h2><div id="detail-body"></div></dialog>
<script type="module" src="./main.js"></script></body></html>
